name: Backend CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run ecosystem smoke test"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate environment contract
        run: npm run validate:env

      - name: Validate security release gate
        run: npm run validate:security

      - name: Validate release docs and workflow gates
        run: npm run validate:release

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run production readiness smoke
        run: npm run smoke:production-readiness

      - name: Run provider health smoke
        run: npm run smoke:provider-health

      - name: Run Oyi runtime smoke
        run: npm run smoke:oyi-runtime

  ecosystem-smoke:
    runs-on: ubuntu-latest
    needs: runtime-smoke
    timeout-minutes: 15
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.run_smoke == 'true') &&
      secrets.SMOKE_BASE_URL != '' &&
      secrets.SMOKE_FACILITY_TOKEN != '' &&
      secrets.SMOKE_RESIDENT_TOKEN != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ecosystem smoke
        env:
          BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          FACILITY_TOKEN: ${{ secrets.SMOKE_FACILITY_TOKEN }}
          RESIDENT_TOKEN: ${{ secrets.SMOKE_RESIDENT_TOKEN }}
          HOME_ID: ${{ secrets.SMOKE_HOME_ID }}
          RESIDENT_EMAIL: ${{ secrets.SMOKE_RESIDENT_EMAIL }}
          CREATE_TEST_MAINTENANCE: ${{ secrets.SMOKE_CREATE_TEST_MAINTENANCE }}
          CREATE_TEST_INVITE: ${{ secrets.SMOKE_CREATE_TEST_INVITE }}
        run: npm run smoke:ecosystem
